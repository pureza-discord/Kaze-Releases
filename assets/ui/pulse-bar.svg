<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 16" width="680" height="16" fill="none">
  <defs>
    <linearGradient id="rail" x1="0" y1="8" x2="680" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cometR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cometL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="clipLeft"><rect x="0" y="0" width="334" height="16"/></clipPath>
    <clipPath id="clipRight"><rect x="346" y="0" width="334" height="16"/></clipPath>
    <style>
      .r { animation: goR 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .l { animation: goL 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .core { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes goR {
        0%   { transform: translateX(340px); opacity: 0; }
        12%  { opacity: 1; }
        85%  { opacity: 0.9; }
        100% { transform: translateX(690px); opacity: 0; }
      }
      @keyframes goL {
        0%   { transform: translateX(250px); opacity: 0; }
        12%  { opacity: 1; }
        85%  { opacity: 0.9; }
        100% { transform: translateX(-100px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.65; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>
  <rect x="0" y="7" width="680" height="2" rx="1" fill="url(#rail)"/>
  <g clip-path="url(#clipRight)">
    <rect class="r" x="0" y="6.2" width="90" height="3.6" rx="1.8" fill="url(#cometR)"/>
  </g>
  <g clip-path="url(#clipLeft)">
    <rect class="l" x="0" y="6.2" width="90" height="3.6" rx="1.8" fill="url(#cometL)"/>
  </g>
  <path class="core" d="M340 2.5 345.5 8 340 13.5 334.5 8 340 2.5Z" fill="#38bdf8" stroke="#fef08a" stroke-width="1"/>
</svg>
