<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 12" width="680" height="12" fill="none">
  <defs>
    <linearGradient id="track" x1="0" y1="6" x2="680" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="10%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="44%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="68%" stop-color="#2563eb" stop-opacity="1"/>
      <stop offset="88%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipRail">
      <rect x="0" y="0" width="680" height="12" rx="6"/>
    </clipPath>
    <style>
      .sweep { animation: slide 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes slide {
        0%   { transform: translateX(-180px); }
        100% { transform: translateX(720px); }
      }
    </style>
  </defs>
  <rect x="0" y="5" width="680" height="2" rx="1" fill="url(#track)"/>
  <g clip-path="url(#clipRail)">
    <g class="sweep">
      <rect x="0" y="2" width="160" height="8" rx="4" fill="url(#glow)"/>
      <rect x="12" y="4" width="136" height="4" rx="2" fill="url(#beam)"/>
      <rect x="134" y="4.5" width="14" height="3" rx="1.5" fill="#e0f2fe"/>
    </g>
  </g>
</svg>
