<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 34" width="166" height="34" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="166" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171528"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="valBg" x1="82" y1="0" x2="166" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect x="1" y="1" width="164" height="32" rx="8"/></clipPath>
    <style>
      .lb { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.9px; fill: #e2e8f0; }
      .vl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.6px; fill: #1c1404; }
      .sw { animation: swp 5s ease-in-out 2.7s infinite; }
      @keyframes swp { 0% { transform: translateX(-80px); } 40% { transform: translateX(220px); } 100% { transform: translateX(220px); } }
    </style>
  </defs>
  <g clip-path="url(#cp)">
    <rect x="0" y="0" width="166" height="34" fill="url(#bg)"/>
    <rect x="82" y="0" width="84" height="34" fill="url(#valBg)"/>
    <rect class="sw" x="0" y="0" width="54" height="34" fill="url(#sh)"/>
  </g>
  <rect x="1" y="1" width="164" height="32" rx="8" stroke="#facc15" stroke-opacity="0.65" stroke-width="1.2"/>
  <path d="M18 11.2 19.6 15l4 .4-3 2.7.9 4-3.5-2.1-3.5 2.1.9-4-3-2.7 4-.4L18 11.2Z" fill="#facc15"/>
  <text class="lb" x="30" y="20.5">PRICE</text>
  <text class="vl" x="124" y="20.8" text-anchor="middle">100% FREE</text>
</svg>
