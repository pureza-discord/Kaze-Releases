  <text class="t t3" x="380" y="22.5" fill="#fef08a">BUILD PLANNER (PVE · DUNGEON · PVP) &amp; HUNT ANALYZER</text>
  <text class="t t4" x="380" y="22.5" fill="#e9d5ff">60-MIN RAM OPTIMIZER · 1-CLICK SHA-512 AUTO-UPDATE</text>
</svg>
