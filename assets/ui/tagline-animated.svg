<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 44" width="760" height="44" fill="none">
  <defs>
    <linearGradient id="capBg" x1="0" y1="0" x2="760" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1121"/>
      <stop offset="50%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#0b1121"/>
    </linearGradient>
    <linearGradient id="capStroke" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipCap">
      <rect x="2" y="2" width="756" height="40" rx="10"/>
    </clipPath>
    <style>
      .t {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2.2px;
        text-anchor: middle;
        dominant-baseline: central;
        opacity: 0;
      }
      .t1 { animation: cycle 16s ease-in-out 0s infinite; }
      .t2 { animation: cycle 16s ease-in-out 4s infinite; }
      .t3 { animation: cycle 16s ease-in-out 8s infinite; }
      .t4 { animation: cycle 16s ease-in-out 12s infinite; }
      .sh { animation: sweep 5.5s ease-in-out infinite; }
      .dm { animation: glow 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(6px); }
        5%   { opacity: 1; transform: translateY(0px); }
        21%  { opacity: 1; transform: translateY(0px); }
        26%  { opacity: 0; transform: translateY(-6px); }
        100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes sweep {
        0%   { transform: translateX(-220px); }
        55%  { transform: translateX(920px); }
        100% { transform: translateX(920px); }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
    </style>
