<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 34" width="166" height="34" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="166" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="valBg" x1="94" y1="0" x2="166" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect x="1" y="1" width="164" height="32" rx="8"/></clipPath>
    <style>
      .lb { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #cbd5e1; }
      .vl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; fill: #071324; }
      .dot { animation: blink 2.2s ease-in-out infinite; }
      .sw { animation: swp 5s ease-in-out 0s infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes swp { 0% { transform: translateX(-80px); } 40% { transform: translateX(220px); } 100% { transform: translateX(220px); } }
    </style>
  </defs>
  <g clip-path="url(#cp)">
    <rect x="0" y="0" width="166" height="34" fill="url(#bg)"/>
    <rect x="94" y="0" width="72" height="34" fill="url(#valBg)"/>
    <rect class="sw" x="0" y="0" width="54" height="34" fill="url(#sh)"/>
  </g>
  <rect x="1" y="1" width="164" height="32" rx="8" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle class="dot" cx="17" cy="17" r="3.6" fill="#38bdf8"/>
  <text class="lb" x="28" y="20.5">RELEASE</text>
  <text class="vl" x="130" y="20.8" text-anchor="middle">v0.9.5</text>
</svg>
