<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 34" width="198" height="34" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="198" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13122b"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <linearGradient id="valBg" x1="118" y1="0" x2="198" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
