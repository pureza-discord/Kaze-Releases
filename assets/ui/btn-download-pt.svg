<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 56" width="390" height="56" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="390" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1d38"/>
      <stop offset="50%" stop-color="#17254a"/>
      <stop offset="100%" stop-color="#1d1438"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="390" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="icBg" x1="16" y1="10" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect x="2" y="2" width="386" height="52" rx="12"/></clipPath>
    <style>
      .t1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; fill: #f8fafc; }
      .t2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; fill: #7dd3fc; }
      .sw { animation: sweep 3.8s ease-in-out infinite; }
      .arr { animation: bob 1.8s ease-in-out infinite; }
      .bd { animation: brd 3s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-140px); } 50% { transform: translateX(480px); } 100% { transform: translateX(480px); } }
      @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(2.2px); } }
      @keyframes brd { 0%, 100% { stroke-opacity: 0.72; } 50% { stroke-opacity: 1; } }
